<!DOCTYPE html>
<html lang="en" data-theme="dark" data-font="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMAIC Continuous Improvement · Conform-Edge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #04080F; --surface: #0E1624; --topbar: rgba(4,8,15,0.92); --sb: rgba(5,9,18,0.86);
            --glass: rgba(8,14,28,0.74); --glass-hi: rgba(6,11,22,0.90);
            --border: rgba(255,255,255,0.055); --border-hi: rgba(14,165,233,0.50);
            --signal: #0EA5E9; --sig-dim: rgba(14,165,233,0.10);
            --positive: #10B981; --pos-dim: rgba(16,185,129,0.12);
            --warning: #F59E0B; --warn-dim: rgba(245,158,11,0.12);
            --t1: #E8F0F8; --t2: #7A90A8; --t3: #3D5570;
            --sh: 0 4px 24px rgba(0,0,0,0.70), 0 1px 4px rgba(0,0,0,0.50);
            --shi: 0 0 40px rgba(14,165,233,0.14), 0 4px 24px rgba(0,0,0,0.70);
            --fs: 14px;
        }
        [data-theme="light"] {
            --void: #D8E4F0; --surface: #FFFFFF; --topbar: rgba(220,232,246,0.94);
            --t1: #0A1628; --t2: #4A607A; --t3: #94A3B8;
        }
        [data-font="compact"] { --fs: 12px; }
        [data-font="default"] { --fs: 14px; }
        [data-font="large"] { --fs: 16px; }
        html { font-size: var(--fs); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--void); color: var(--t1); overflow: hidden; }
        #root { width: 100%; height: 100vh; display: flex; flex-direction: column; }
        #canvas-container { position: fixed; inset: 0; z-index: 0; }
        .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 48px; background: var(--topbar); backdrop-filter: blur(24px); border-bottom: 1px solid var(--border); }
        .brand { font-size: 0.95rem; font-weight: 800; color: var(--t1); text-transform: uppercase; }
        .brand em { color: var(--signal); font-style: normal; }
        .ui-layer { position: fixed; inset: 0; z-index: 10; margin-top: 48px; display: flex; }
        .sidebar { width: 280px; background: var(--sb); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; }
        .sb-btn { width: 100%; padding: 9px 10px; margin-bottom: 12px; background: var(--signal); color: #fff; border: none; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
        .sb-item { padding: 8px 10px; margin-bottom: 6px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); cursor: pointer; font-size: 0.78rem; color: var(--t2); }
        .sb-item.active { background: var(--sig-dim); border-color: var(--border-hi); color: var(--signal); font-weight: 600; }
        .content { flex: 1; overflow: auto; padding: 24px; position: relative; }
        .home { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .panel { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
        .panel-title { font-size: 1rem; font-weight: 700; color: var(--t1); }
        .stag { padding: 3px 9px; border-radius: 20px; font-size: 0.59rem; font-weight: 600; text-transform: uppercase; border: 1px solid var(--border); color: var(--t3); }
        .stag.complete { color: var(--positive); border-color: var(--positive); background: var(--pos-dim); }
        .stag.in-progress { color: var(--signal); border-color: var(--signal); background: var(--sig-dim); }
        .panel-content { display: none; }
        .panel-content.active { display: block; }
        .form-textarea { width: 100%; padding: 9px 12px; background: var(--void); border: 1px solid var(--border); border-radius: 8px; color: var(--t1); font-size: 0.84rem; font-family: inherit; resize: vertical; min-height: 80px; }
        .panel-footer { display: flex; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
        .small-btn { flex: 1; padding: 7px 12px; font-size: 0.73rem; border: 1px solid var(--border); background: var(--surface); color: var(--t2); border-radius: 6px; cursor: pointer; font-family: inherit; }
        .small-btn:hover { background: rgba(14,165,233,0.05); border-color: var(--border-hi); color: var(--signal); }
        .btn-primary { padding: 9px 16px; background: var(--signal); color: #fff; border: none; border-radius: 8px; font-size: 0.79rem; font-family: inherit; cursor: pointer; }
        .dashboard { position: absolute; top: 20px; right: 20px; width: 300px; background: var(--glass-hi); backdrop-filter: blur(24px); border: 1px solid var(--border-hi); border-radius: 13px; padding: 16px; display: none; }
        .dashboard.active { display: block; }
        .db-card { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .db-label { font-size: 0.62rem; font-weight: 600; text-transform: uppercase; color: var(--t3); margin-bottom: 4px; }
        .db-value { font-size: 1.4rem; font-weight: 700; color: var(--signal); }
        .modal-bg { position: fixed; inset: 0; z-index: 300; background: rgba(2,5,12,0.72); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; }
        .modal-bg.show { display: flex; }
        .modal { background: var(--glass-hi); backdrop-filter: blur(28px); border: 1px solid var(--border-hi); border-radius: 18px; padding: 28px 30px; width: 100%; max-width: 520px; }
        .modal-title { font-size: 1.2rem; font-weight: 700; color: var(--t1); margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; color: var(--t3); margin-bottom: 6px; display: block; }
        .form-input { width: 100%; padding: 9px 12px; background: var(--void); border: 1px solid var(--border); border-radius: 8px; color: var(--t1); font-size: 0.84rem; font-family: inherit; }
        .modal-footer { display: flex; gap: 10px; margin-top: 24px; justify-content: flex-end; }
        .ib { width: 26px; height: 26px; border-radius: 5px; border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--t2); font-size: 0.71rem; font-family: inherit; display: flex; align-items: center; justify-content: center; }
        .ib:hover { background: var(--surface); border-color: var(--border-hi); color: var(--t1); }
        .ib.on { background: var(--sig-dim); border-color: var(--border-hi); color: var(--signal); }
        .tsp { flex: 1; }
        .tsep { width: 1px; height: 16px; background: var(--border); }
    </style>
</head>
<body>
<div id="root">
    <div id="canvas-container"></div>
    <header class="topbar">
        <div class="brand">CONFORM<em>-</em>EDGE <span style="font-weight: 400; font-size: 0.85rem; color: var(--t2);">· DMAIC</span></div>
        <div class="tsep"></div>
        <div style="font-size: 0.67rem; color: var(--t3);">
            <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--positive); display: inline-block; margin-right: 5px; box-shadow: 0 0 7px var(--positive);"></span>operational
        </div>
        <div class="tsp"></div>
        <div style="display: flex; gap: 2px;">
            <button class="ib" id="fs-compact" onclick="app.setFont('compact')">A−</button>
            <button class="ib on" id="fs-default" onclick="app.setFont('default')">A</button>
            <button class="ib" id="fs-large" onclick="app.setFont('large')">A+</button>
            <div class="tsep"></div>
            <button class="ib" onclick="app.toggleTheme()">◑</button>
            <button class="ib" onclick="app.toggleSidebar()">☰</button>
        </div>
    </header>
    <div class="ui-layer">
        <aside class="sidebar" id="sidebar">
            <div style="margin-bottom: 24px;">
                <div style="font-size: 0.60rem; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--t3); margin-bottom: 10px;">Projects</div>
                <button class="sb-btn" onclick="app.openNewProjectModal()">+ NEW</button>
                <div id="projectList"></div>
            </div>
        </aside>
        <div class="content" id="content">
            <div class="home" id="home">
                <div style="font-size: 0.64rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--signal); margin-bottom: 14px;">DMAIC Model</div>
                <div style="font-size: 1.55rem; font-weight: 700; color: var(--t1); margin-bottom: 10px;">Continuous Improvement</div>
                <div style="font-size: 0.83rem; color: var(--t2); max-width: 440px; margin-bottom: 32px;">Five-phase structured approach to process improvement and optimization.</div>
                <button class="btn-primary" onclick="app.openNewProjectModal()" style="padding: 14px 28px; font-size: 0.92rem; background: var(--signal); color: #fff; border: none; border-radius: 12px; font-weight: 700; cursor: pointer;">＋ NEW PROJECT</button>
            </div>
            <div id="projectView"></div>
            <div class="dashboard" id="dashboard"></div>
        </div>
    </div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target === this) app.closeModal()">
    <div class="modal">
        <div class="modal-title">+ NEW DMAIC PROJECT</div>
        <div class="form-group">
            <label class="form-label">Project Name</label>
            <input class="form-input" id="projName" placeholder="Improvement initiative">
        </div>
        <div class="form-group">
            <label class="form-label">Owner</label>
            <input class="form-input" id="projOwner" placeholder="Responsible person">
        </div>
        <div class="form-group">
            <label class="form-label">Target Metric</label>
            <input class="form-input" id="projMetric" placeholder="What are we improving?">
        </div>
        <div class="modal-footer">
            <button class="btn-primary" style="background: transparent; color: var(--t2); border: 1px solid var(--border);" onclick="app.closeModal()">Cancel</button>
            <button class="btn-primary" onclick="app.createProject()">Create Project</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const PHASES = [
    {id:'define',name:'Define',n:1},{id:'measure',name:'Measure',n:2},{id:'analyze',name:'Analyze',n:3},
    {id:'improve',name:'Improve',n:4},{id:'control',name:'Control',n:5}
];

const app={projects:JSON.parse(localStorage.getItem('dmaic-projects')||'{}'),currentProjId:localStorage.getItem('dmaic-current')||null,
save(){localStorage.setItem('dmaic-projects',JSON.stringify(this.projects));localStorage.setItem('dmaic-current',this.currentProjId);},
setFont(s){document.documentElement.setAttribute('data-font',s);localStorage.setItem('ce-font',s);document.querySelectorAll('[id^="fs-"]').forEach(b=>b.classList.remove('on'));document.getElementById('fs-'+s).classList.add('on');},
toggleTheme(){const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('ce-theme',n);},
toggleSidebar(){document.getElementById('sidebar').style.display=document.getElementById('sidebar').style.display==='none'?'block':'none';},
openNewProjectModal(){document.getElementById('modalBg').classList.add('show');},
closeModal(){document.getElementById('modalBg').classList.remove('show');document.getElementById('projName').value='';document.getElementById('projOwner').value='';document.getElementById('projMetric').value='';},
createProject(){const n=document.getElementById('projName').value.trim(),o=document.getElementById('projOwner').value.trim(),m=document.getElementById('projMetric').value.trim();if(!n||!o||!m){alert('Fill in all fields');return;}const id='PROJ-'+Date.now();this.projects[id]={id,name:n,owner:o,metric:m,createdDate:new Date().toISOString().split('T')[0],phases:{}};PHASES.forEach(p=>{this.projects[id].phases[p.id]={status:'new',notes:''}});this.currentProjId=id;this.save();this.closeModal();this.render();},
renderProjectList(){const list=document.getElementById('projectList');list.innerHTML='';Object.values(this.projects).forEach(proj=>{const div=document.createElement('div');div.className='sb-item'+(proj.id===this.currentProjId?' active':'');div.textContent=proj.id;div.onclick=()=>{this.currentProjId=proj.id;this.save();this.render();};list.appendChild(div);});},
updateStatus(pid,status){if(this.currentProjId&&this.projects[this.currentProjId]){this.projects[this.currentProjId].phases[pid].status=status;this.save();setTimeout(()=>this.render(),0);}},
saveNotes(pid){if(this.currentProjId&&this.projects[this.currentProjId]){this.projects[this.currentProjId].phases[pid].notes=document.getElementById('notes-'+pid).value;this.save();alert('Saved!');}},
togglePanel(pid,e){if(e){e.preventDefault();e.stopPropagation();}const c=document.getElementById('panel-'+pid);if(c)c.classList.toggle('active');},
render(){this.renderProjectList();const home=document.getElementById('home'),view=document.getElementById('projectView'),dash=document.getElementById('dashboard');if(!this.currentProjId||!this.projects[this.currentProjId]){home.style.display='flex';view.innerHTML='';dash.classList.remove('active');return;}const proj=this.projects[this.currentProjId];home.style.display='none';dash.classList.add('active');let html='';PHASES.forEach(p=>{const phase=proj.phases[p.id];html+=`<div class="panel" onclick="app.togglePanel('${p.id}',event)"><div class="panel-header"><div class="panel-title">Phase ${p.n} · ${p.name}</div><span class="stag ${phase.status}">${phase.status.replace('-',' ')}</span></div><div class="panel-content" id="panel-${p.id}"><div class="form-group"><label class="form-label">Details</label><textarea class="form-textarea" id="notes-${p.id}">${phase.notes}</textarea></div><div class="panel-footer"><button class="small-btn" onclick="event.stopPropagation();app.updateStatus('${p.id}','new');return false">New</button><button class="small-btn" onclick="event.stopPropagation();app.updateStatus('${p.id}','in-progress');return false">In Progress</button><button class="small-btn" onclick="event.stopPropagation();app.updateStatus('${p.id}','complete');return false">Complete</button><button class="small-btn" onclick="event.stopPropagation();app.saveNotes('${p.id}');return false">Save</button></div></div></div>`;});view.innerHTML=html;const c=Object.values(proj.phases).filter(p=>p.status==='complete').length;dash.innerHTML=`<div class="db-card"><div class="db-label">PROJECT</div><div class="db-value" style="font-size:0.95rem;word-break:break-all;">${proj.id}</div></div><div class="db-card"><div class="db-label">Progress</div><div class="db-value">${c}/${PHASES.length}</div></div><div class="db-card"><div class="db-label">Metric</div><div style="font-size:0.78rem;color:var(--t2);">${proj.metric}</div></div>`;}};
document.addEventListener('DOMContentLoaded',()=>{const th=localStorage.getItem('ce-theme')||'dark',fn=localStorage.getItem('ce-font')||'default';document.documentElement.setAttribute('data-theme',th);app.setFont(fn);app.render();initThreeJS();});
function initThreeJS(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;z-index:0;';document.getElementById('canvas-container').appendChild(c);const s=new THREE.Scene();s.background=new THREE.Color(0x04080F);const cam=new THREE.PerspectiveCamera(52,window.innerWidth/window.innerHeight,0.1,1000);cam.position.set(0,0,8);const r=new THREE.WebGLRenderer({canvas:c,antialias:!0});r.setSize(window.innerWidth,window.innerHeight);const l=new THREE.DirectionalLight(0xffffff,0.6);l.position.set(10,20,10);s.add(l);s.add(new THREE.AmbientLight(0xffffff,0.4));let t=0;function a(){requestAnimationFrame(a);t+=0.0002;cam.position.x=Math.cos(t)*8;cam.position.z=Math.sin(t)*8;cam.lookAt(0,0,0);r.render(s,cam);}a();}
</script>
</body>
</html>
