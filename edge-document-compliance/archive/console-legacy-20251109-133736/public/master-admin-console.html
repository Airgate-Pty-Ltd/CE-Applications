<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conform-Edge Admin Console</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", "Inter", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }

      .card {
        text-align: center;
        padding: 40px 48px;
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.25);
        box-shadow: 0 25px 60px rgba(15, 23, 42, 0.55);
      }

      a {
        color: #38bdf8;
        text-decoration: none;
        font-weight: 600;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Conform-Edge Admin Console</h1>
      <p>The Edge-Document Compliance Assessment Tool (EDCAT) deployer has been merged into the unified console.</p>
      <p>
        Access the consolidated experience at
        <a href="/Modules/edcat/ui/edcat.html">/Modules/edcat/ui/edcat.html</a>.
      </p>
      <p>Use the “Provisioning Console” toggle inside the runtime header to manage customers.</p>
    </div>
  </body>
</html>
