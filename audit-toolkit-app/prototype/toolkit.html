<!doctype html>
<!--
Conform-Edge Audit Toolkit — INTERACTIVE PRODUCT PROTOTYPE v0.3 (corrected product definition, 2026-10-11)
The Toolkit is an audit PLANNING, PROGRAM, CHECKLIST, SCAR-RESPONSE and NCR-STATEMENT toolbox powered by a governed Requirement Intelligence
Library. Field audit execution belongs to the separate Pocket Auditor product; this page only IMPORTS recorded results.

REAL: checklist content is consumed from the library content pack (manifest verified on load); planning, program coverage (7 categories from
obligation identifiers), SCAR review, competency scoring and the NCR gates are deterministic logic with headless tests.
SIMULATED / NOT REAL: all organizations, people, records and SCAR facts are synthetic; imported audit results are a synthetic export; the library holds
5 demonstration obligations (AI-assisted draft, UNVERIFIED, NOT-RELEASABLE); the ten-standard preset library is a status list, not content;
competency items are practice-only (no expert review); coverage policies are unverified; storage is browser localStorage.
No internal system names appear in the customer experience.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conform-Edge Audit Toolkit — Prototype</title>
<style>
:root{--bg:#0A0F17;--panel:#111826;--panel2:#16202F;--line:#22314a;--line2:#1a2740;--t1:#EEF3F9;--t2:#A3B2C7;--t3:#7a8ba3;--sig:#38BDF8;--sigbg:rgba(56,189,248,.12);--sigsolid:#0EA5E9;--ok:#34D399;--okbg:rgba(52,211,153,.12);--bad:#F87171;--badbg:rgba(248,113,113,.12);--warn:#FBBF24;--warnbg:rgba(251,191,36,.12);--guide:#A78BFA;--guidebg:rgba(167,139,250,.12);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme="light"]{--bg:#F3F6FA;--panel:#FFFFFF;--panel2:#EEF3F9;--line:#D3DDEA;--line2:#E4EAF2;--t1:#0D1726;--t2:#44546B;--t3:#667790;--sig:#0369A1;--sigbg:rgba(14,165,233,.12);--sigsolid:#0284C7;--ok:#047857;--okbg:rgba(16,185,129,.12);--bad:#B91C1C;--badbg:rgba(239,68,68,.10);--warn:#B45309;--warnbg:rgba(245,158,11,.14);--guide:#6D28D9;--guidebg:rgba(139,92,246,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--t2);font:15px/1.5 var(--sans)}button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:1240px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(66px + env(safe-area-inset-bottom))}.app.phone{max-width:430px}
.bar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.bar .back{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:none;cursor:pointer;font-size:18px}.bar .ttl{flex:1;min-width:0}.bar .ttl b{display:block;color:var(--t1);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .ttl small{color:var(--t3);font:11px var(--mono)}
.demo{background:var(--warnbg);color:var(--warn);border-bottom:1px solid var(--line);padding:6px 16px;font-size:12px}
.review{background:var(--panel2);border-bottom:1px solid var(--line);padding:6px 16px;font-size:11.5px;color:var(--t3);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}.review button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:11.5px;color:var(--t2)}.review button.on{border-color:var(--sig);color:var(--sig)}
.layout{flex:1}.rail{display:none}.main{padding:16px;min-width:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom)}.tabs button{flex:1 0 74px;background:none;border:0;padding:8px 2px 9px;color:var(--t3);cursor:pointer;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}.tabs button .i{font-size:18px;line-height:1}.tabs button.on{color:var(--sig)}
.app.tablet .layout{display:grid;grid-template-columns:230px 1fr}.app.tablet .rail{display:block;border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;background:var(--panel)}.app.tablet .main{padding:20px 28px}.app.tablet ~ .tabs{display:none}
.rail .ri{display:flex;gap:8px;align-items:center;padding:10px;border-radius:8px;cursor:pointer;color:var(--t2);min-height:44px}.rail .ri.on,.rail .ri:hover{background:var(--sigbg);color:var(--sig)}
h2{color:var(--t1);font-size:19px;margin:0 0 6px}h3{margin:0 0 10px;font:600 12px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--t3)}h4{color:var(--t1);margin:14px 0 6px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin:0 0 12px}.card.tap{cursor:pointer}.card.tap:hover{border-color:var(--sig)}
.row{display:flex;gap:10px;align-items:center}.sp{display:flex;gap:10px;align-items:center;justify-content:space-between}.wrap{flex-wrap:wrap}.muted{color:var(--t3)}.sm{font-size:13px}.xs{font-size:12px}.mono{font-family:var(--mono)}.b{color:var(--t1);font-weight:600}
.pill{font:11px var(--mono);padding:2px 8px;border-radius:6px;background:var(--sigbg);color:var(--sig)}.tag{display:inline-flex;gap:6px;align-items:center;font:11.5px var(--mono);padding:2px 8px;border-radius:6px;white-space:normal;max-width:100%;overflow-wrap:anywhere}.tag:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 7px}
.t-ok{background:var(--okbg);color:var(--ok)}.t-bad{background:var(--badbg);color:var(--bad)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-neu{background:var(--panel2);color:var(--t3)}.t-sig{background:var(--sigbg);color:var(--sig)}
.kv{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line2)}.kv:last-child{border:0}.kv .k{flex:0 0 100px;font:11px var(--mono);text-transform:uppercase;color:var(--t3);padding-top:2px}.kv .v{flex:1;min-width:0}
.btn{background:var(--sigsolid);color:#04121c;border:0;border-radius:10px;padding:12px 16px;font-weight:650;cursor:pointer;width:100%;min-height:46px}:root[data-theme="light"] .btn{color:#fff}.btn:disabled{background:var(--panel2);color:var(--t3);cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);border-radius:9px;padding:9px 13px;cursor:pointer;min-height:42px;color:var(--t2)}.ghost:hover{border-color:var(--sig);color:var(--sig)}.ghost.s{padding:6px 10px;min-height:36px;font-size:13px}
.chipb{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:8px 14px;margin:0 6px 8px 0;cursor:pointer;min-height:40px}.chipb.on{border-color:var(--sig);background:var(--sigbg);color:var(--sig)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:4px;color:var(--t1)}textarea{min-height:76px;resize:vertical}input[type=checkbox],input[type=radio]{width:28px;height:28px;margin:0;flex:0 0 28px}select{max-width:100%}
label.fl{display:block;margin-top:12px;font:11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--t3)}label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2);min-height:44px;cursor:pointer}
.guide{border:1px solid var(--guide);border-left:3px solid var(--guide);background:var(--guidebg);border-radius:10px;padding:12px 14px;margin:12px 0}.guide .h{color:var(--guide);font:600 12px var(--mono);text-transform:uppercase;margin-bottom:4px}
.block{border:1px solid var(--bad);background:var(--badbg);color:var(--bad);border-radius:10px;padding:10px 13px;margin:8px 0;font-size:13.5px}.okbox{border:1px solid var(--ok);background:var(--okbg);color:var(--ok);border-radius:10px;padding:10px 13px;margin:8px 0;font-size:13.5px}.warnbox{border:1px solid var(--warn);background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 13px;margin:8px 0;font-size:13.5px}
.gate{display:flex;gap:9px;padding:9px 12px;border-radius:9px;margin:6px 0;font-size:13.5px}.gate.p{background:var(--okbg);color:var(--ok)}.gate.f{background:var(--badbg);color:var(--bad)}.gate b{font:600 11px var(--mono);flex:0 0 22px;padding-top:2px}
.sec{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}.sec.sb{border-left:3px solid var(--sig)}.sec.af{border-left:3px solid var(--warn)}
.steps{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.steps button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:8px 13px;cursor:pointer;min-height:40px;font-size:13px}.steps button.on{border-color:var(--sig);color:var(--sig);background:var(--sigbg)}
.tree .n{display:flex;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line2);min-height:42px}.tree .n.auth{cursor:pointer}.tree .n.auth:hover{background:var(--sigbg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}.tile{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--panel2)}.tile.on{border-color:var(--sig)}.tile b{display:block;font-size:22px;color:var(--t1)}.tile span{font-size:11.5px;color:var(--t3)}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th,table.t td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line2);vertical-align:top}table.t th{font:11px var(--mono);text-transform:uppercase;color:var(--t3)}.tscroll{overflow-x:auto}table.t td:first-child,table.t th:first-child{white-space:nowrap}table.t .tag{white-space:nowrap}table.t td.mono{white-space:nowrap}
.doc{background:#fff;color:#111;border-radius:8px;padding:16px;font:14px/1.5 Georgia,serif;overflow-wrap:anywhere}.doc h1{font-size:20px}.doc h2{font-size:16px;color:#111}.doc h3{font-size:14px;color:#111}.doc table{border-collapse:collapse;width:100%}.doc td,.doc th{border:1px solid #999;padding:4px;font-size:13px}
details.aid{border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:12px 0;background:var(--panel2)}details.aid summary{cursor:pointer;color:var(--t3);font:12px var(--mono)}
.kv .v,.card,.sec,.guide,.block,.okbox,.warnbox,.gate,.tile{overflow-wrap:anywhere;word-break:break-word}
.legal{text-align:center;color:var(--t3);font-size:11px;border-top:1px solid var(--line);padding:16px 8px;margin-top:20px}.progress{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}.progress span{display:block;height:100%;background:var(--sigsolid)}
@media print{.bar,.tabs,.review,.rail,.noprint,.demo{display:none!important}.app{max-width:none}}
</style>

<body>
<div class="app" id="app">
  <div class="bar"><button class="back" id="back" onclick="goBack()" aria-label="Back" style="visibility:hidden">‹</button><div class="ttl"><b id="ttl">Audit Toolkit</b><small id="sub"></small></div><span class="pill" id="packpill"></span></div>
  <div class="demo" id="demo"></div>
  <div class="review noprint"><span>Prototype · synthetic data · review aids:</span><button id="bPhone" onclick="setLayout('phone')">Phone</button><button id="bTab" onclick="setLayout('tablet')">Tablet</button><button id="bAuto" onclick="setLayout(null)">Auto</button><button onclick="toggleTheme()">◐ Theme</button><button onclick="resetAll()">Reset all</button></div>
  <div class="layout"><aside class="rail" id="rail"></aside><main class="main" id="main"></main></div>
</div>
<nav class="tabs" id="tabs"></nav>

<script src="../vendor/resolver.js"></script>
<script src="../vendor/ril/library.js"></script>
<script src="../vendor/ril/consumer-views.js"></script>
<script src="../vendor/ril/as9100d-demo@0.3.0.contentpack.js"></script>
<script src="../src/verification.js"></script>
<script src="../src/audit-core.js"></script>
<script src="../src/synthetic-data.js"></script>
<script src="../src/session.js"></script>
<script src="../src/walkthrough.js"></script>
<script src="../src/planner-core.js"></script>
<script src="../src/program-core.js"></script>
<script src="../src/scar-core.js"></script>
<script src="../src/competency-core.js"></script>
<script src="../src/toolkit-data.js"></script>
<script>
/* ======================= state & persistence ======================= */
const Core=AuditCore, Data=SyntheticData, PL=AuditPlanner, PG=AuditProgram, SC=ScarBuilder, CP=Competency, TD=ToolkitData;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id); const TODAY='2026-10-11';
const KEY='ce-toolkit-v3'; let storageNote='';
const BASE_PACK=Data.LIB;
function freshState(){ return { plan:null, planStep:1, program:null, scar:null, comp:{seed:0,answers:{},result:null}, imported:null, ncrId:null, sim:false, lib:{std:'AS9100D',ob:null,showPA:false}, screen:'dashboard', pg:{tile:'notCovered',report:false}, scarView:'edit', exportView:null }; }
let T=freshState(); let ui={stack:[],layout:null,msg:{}}; let S=null; // S = imported audit session (NCR builder source)
function load(){ try{ const raw=localStorage.getItem(KEY); if(!raw) return; const o=JSON.parse(raw); if(!o||o.v!==3) throw new Error('unrecognised'); T=Object.assign(freshState(),o.T); }catch(e){ storageNote='Saved data could not be read ('+e.message+'); started fresh. The unreadable copy was kept under a backup key.'; try{ localStorage.setItem(KEY+'-corrupt-backup',localStorage.getItem(KEY)||''); localStorage.removeItem(KEY);}catch(_){} } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({v:3,T})); }catch(e){ storageNote='Changes are not being saved on this device ('+e.message+').'; } }
load();
function importedSession(){ if(!T.imported) return null; if(!S||S.audit.id!==T.imported.id) S=AuditSession.restore(T.imported); return S; }
function pack(){ if(!T.sim) return BASE_PACK; const p=JSON.parse(JSON.stringify(BASE_PACK)); p.contentVersion='0.3.1'; p.obligations.find(o=>o.obligationId==='OB-8.5.2').sampling.guidance+=' Include at least one lot that was split or reworked.'; p.obligations.find(o=>o.obligationId==='OB-7.1.5.2-a').auditQuestions[2]+=' Compare against the work order tool logs, not only the register.'; return p; }
function manifest(){ return RIL.buildManifest(pack()); }
const ix=()=>RIL.obligationIndex(pack());
const fmtH=h=>h?h.slice(0,12):'';

/* ======================= layout / nav ======================= */
function setLayout(l){ ui.layout=l; applyLayout(); } function applyLayout(){ const a=$('app'); const l=ui.layout||(window.innerWidth>=820?'tablet':'phone'); a.classList.toggle('tablet',l==='tablet'); a.classList.toggle('phone',l==='phone'&&!!ui.layout); ['bPhone','bTab','bAuto'].forEach(i=>$(i).classList.remove('on')); $(ui.layout==='phone'?'bPhone':ui.layout==='tablet'?'bTab':'bAuto').classList.add('on'); }
window.addEventListener('resize',applyLayout);
function toggleTheme(){ const r=document.documentElement; r.setAttribute('data-theme',r.getAttribute('data-theme')==='light'?'dark':'light'); }
document.documentElement.setAttribute('data-theme',(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark');
function resetAll(){ if(!confirm('Reset all saved Toolkit data in this browser?')) return; T=freshState(); S=null; ui={stack:[],layout:ui.layout,msg:{}}; render(); }
const NAV=[['dashboard','⌂','Dashboard'],['planner','◳','Audit Planner'],['program','▦','Audit Program'],['library','❏','Checklist Library'],['scar','✉','SCAR Builder'],['ncr','⚑','NCR Builder'],['competency','✓','Competency']];
function tab(s){ ui.stack=[]; T.screen=s; render(); window.scrollTo(0,0); }
function go(s){ ui.stack.push(T.screen); T.screen=s; render(); window.scrollTo(0,0); } function goBack(){ const p=ui.stack.pop(); if(p){T.screen=p;render();} }
function render(){
  save();
  const t=NAV.find(n=>n[0]===T.screen); $('ttl').textContent=t?t[2]:'Audit Toolkit'; $('sub').textContent='';
  $('back').style.visibility=ui.stack.length?'visible':'hidden';
  const m=manifest(); $('packpill').textContent='library '+m.packId+' '+m.contentVersion;
  $('demo').innerHTML='<b>DEMONSTRATION.</b> Synthetic data · library pack '+esc(m.packId)+' '+esc(m.contentVersion)+' sha256:'+fmtH(m.packHash)+' · '+esc(m.release.status)+' · content AI-assisted draft, not verified. Not an audit record.';
  $('tabs').innerHTML=NAV.map(n=>`<button class="${T.screen===n[0]?'on':''}" onclick="tab('${n[0]}')"><span class="i">${n[1]}</span>${n[2]}</button>`).join('');
  $('rail').innerHTML=NAV.map(n=>`<div class="ri ${T.screen===n[0]?'on':''}" onclick="tab('${n[0]}')">${n[1]} ${n[2]}</div>`).join('')+'<p class="muted xs" style="margin:14px 8px">Field audit execution is a separate product. This toolbox plans, prepares and responds.</p>';
  $('main').innerHTML=(V[T.screen]||(()=>''))()+legal();
  if(T.screen==='ncr'&&T.ncrId){ citeRefresh(); gatesRefresh(); }
  applyLayout();
}
const legal=()=>`<div class="legal"><div class="b">Conform-Edge™ Audit Toolkit</div><div style="margin:6px 0">Standard designations are referenced for identification only; each remains the property of its publisher. Users must hold their own licensed copy of any referenced standard.</div>© 2026 Conform-Edge Quality Consulting LLC (entity subject to verification) · v0.3 prototype</div>`;
const V={};
const tag=(cls,t)=>`<span class="tag ${cls}">${esc(t)}</span>`;

/* ======================= Dashboard ======================= */
V.dashboard=()=>{
  const m=manifest(), comp=RIL.completeness(pack()), prg=T.program?PG.coverage(T.program,pack()):null, plan=T.plan, drift=plan&&plan.stamps?PL.planDrift(plan,m):null; const sc=T.scar?SC.reviewScar(T.scar):null;
  return `${storageNote?`<div class="block">${esc(storageNote)}</div>`:''}
  <h2>Dashboard</h2><p class="muted sm" style="margin:0 0 12px">Plan audits, build programs, prepare checklists, respond to SCARs and construct NCR statements from one governed checklist library.</p>
  ${(drift&&drift.drifted)||(prg&&prg.counts.reeval)?`<div class="warnbox"><b>Library update detected (${esc(m.contentVersion)}).</b> Nothing was changed automatically. ${drift&&drift.drifted?'Approved plan references revised content: '+drift.changed.join(', ')+'. ':''}${prg&&prg.reeval.length?'Program obligations flagged for re-evaluation: '+prg.reeval.join(', ')+'.':''}</div>`:''}
  <div class="card"><h3>Requirement Intelligence Library</h3>
    <div class="kv"><span class="k">Pack</span><span class="v">${esc(m.packId)} · ${esc(m.contentVersion)} · ${esc(m.standard.id)} ${esc(m.edition.label)} ${tag('t-ok','manifest verified')}</span></div>
    <div class="kv"><span class="k">Release</span><span class="v">${tag('t-bad',m.release.status)} ${tag('t-warn','signature: '+m.signature.state)}</span></div>
    <div class="kv"><span class="k">Index</span><span class="v">${comp.obligations} obligation records · ${comp.stats.leaves} hierarchy leaves · ${comp.stats.auditableWithObligation} authored · ${comp.stats.unclassified.length} unclassified ${tag('t-warn','INCOMPLETE')}</span></div>
    <details class="aid"><summary>Why this pack is not releasable (${comp.reasons.length})</summary>${comp.reasons.map(r=>`<div class="xs" style="padding:2px 0">• ${esc(r)}</div>`).join('')}</details>
    <div class="row wrap" style="margin-top:8px"><button class="ghost s" onclick="tab('library')">Open Checklist Library</button><button class="ghost s noprint" onclick="T.sim=!T.sim;render()">${T.sim?'Revert simulated library update':'Simulate library update (0.3.1)'}</button></div>
    <p class="muted xs" style="margin:8px 0 0">The Audit Toolkit and the Pocket Auditor field product consume this same content through pinned, hash-verified packs; neither keeps its own copy.</p></div>
  <div class="card"><h3>Your work</h3>
    <div class="kv"><span class="k">Audit plan</span><span class="v">${plan?esc(plan.id)+' · '+tag(plan.status==='Approved'?'t-ok':'t-warn',plan.status)+' · '+plan.obligationIds.length+' requirements':'none yet'} <button class="ghost s" onclick="tab('planner')">${plan?'Open':'Start'}</button></span></div>
    <div class="kv"><span class="k">Program</span><span class="v">${prg?esc(T.program.name)+' · '+prg.counts.assigned+'/'+prg.counts.applicable+' applicable assigned · '+prg.counts.notCovered+' uncovered':'none yet'} <button class="ghost s" onclick="tab('program')">${prg?'Open':'Start'}</button></span></div>
    <div class="kv"><span class="k">SCAR</span><span class="v">${T.scar?esc(T.scar.customerRef)+' · '+(sc.ready?tag('t-ok','response ready'):tag('t-warn',sc.blockers.length+' open items')):'none yet'} <button class="ghost s" onclick="tab('scar')">${T.scar?'Open':'Start'}</button></span></div>
    <div class="kv"><span class="k">NCR</span><span class="v">${T.imported?esc(T.imported.id)+' imported · '+T.imported.ncrs.length+' NCR draft(s)':'no imported results'} <button class="ghost s" onclick="tab('ncr')">Open</button></span></div>
    <div class="kv"><span class="k">Competency</span><span class="v">${T.comp.result?T.comp.result.pct+'% practice result':'not taken'} <button class="ghost s" onclick="tab('competency')">Open</button></span></div></div>
  <div class="card"><h3>Preset standards library (first ten commercial packs)</h3><p class="muted xs" style="margin:0 0 6px">Status list, not content. Editions, amendments, transition status, licence and source availability must be verified before authoring (see the edition register).</p>
    ${TD.PRESET_LIBRARY.map(s=>`<div class="kv"><span class="k">${s.n}</span><span class="v"><span class="b">${esc(s.name)}</span><br>${tag(s.demo?'t-warn':'t-neu',s.contentStatus)} ${tag('t-neu','edition: '+s.editionStatus)} ${tag('t-bad','licence: '+s.licenceStatus)}</span></div>`).join('')}
    <h4>Methodology and scheme references (inform the planning engine; not content packs)</h4>${TD.METHOD_REFERENCES.map(r=>`<div class="xs" style="padding:2px 0">• <b>${esc(r.name)}</b> — ${esc(r.role)}</div>`).join('')}
    <h4>Future bolt-on packs (architecture supports unlimited packs)</h4><div class="xs">${TD.FUTURE_PACKS.map(esc).join(' · ')}</div></div>`;
};

/* ======================= Checklist Library ======================= */
function nodeStatus(n,p){ if((n.children||[]).length) return ['t-neu','parent']; if((n.obligationIds||[]).length) return ['t-ok','authored (deep)']; if(n.auditable==='no') return ['t-neu','not auditable']; return ['t-warn','unclassified leaf']; }
V.library=()=>{
  const std=TD.PRESET_LIBRARY.find(s=>s.id===T.lib.std)||TD.PRESET_LIBRARY[1];
  const head=`<h2>Checklist Library</h2><label class="fl">Standard</label><select onchange="T.lib.std=this.value;T.lib.ob=null;render()">${TD.PRESET_LIBRARY.map(s=>`<option value="${s.id}" ${s.id===T.lib.std?'selected':''}>${s.n}. ${esc(s.name)}</option>`).join('')}</select>`;
  if(!std.demo) return head+`<div class="card" style="margin-top:12px"><h3>${esc(std.name)}</h3><div class="kv"><span class="k">Content</span><span class="v">${tag('t-neu','Not authored')}</span></div><div class="kv"><span class="k">Edition</span><span class="v">${esc(std.editionStatus)}</span></div><div class="kv"><span class="k">Licence</span><span class="v">${esc(std.licenceStatus)}</span></div><p class="sm">No clause hierarchy or checklist exists for this standard. Authoring starts only after edition, licence and source availability are verified and the pilot standard has passed the complete-checklist, coverage, shared-consumption and expert-scenario validation steps.</p></div>`;
  if(T.lib.ob) return head+libDetail(T.lib.ob);
  const p=pack(), comp=RIL.completeness(p); const kids=ref=>(p.hierarchy.find(n=>n.ref===ref)||{}).children||[]; const nodes={}; p.hierarchy.forEach(n=>{nodes[n.ref]=n;});
  const roots=p.hierarchy.filter(n=>!n.parent && !/\(/.test(n.ref));
  const walk=(n,d)=>{ const [c,l]=nodeStatus(n,p); const auth=(n.obligationIds||[]).length; const ttl=auth?ix()[n.obligationIds[0]].title:(/\(/.test(n.ref)?'':n.title); return `<div class="n ${auth?'auth':''}" style="padding-left:${6+d*10}px;flex-wrap:wrap" ${auth?`onclick="T.lib.ob='${n.obligationIds[0]}';render()"`:''}><span class="mono xs" style="color:var(--sig);white-space:nowrap">${esc(n.ref)}</span><span style="flex:1 1 150px;min-width:0">${esc(ttl)}</span>${tag(c,l)}</div>`+(n.children||[]).map(k=>nodes[k]?walk(nodes[k],d+1):'').join(''); };
  return head+`<p class="muted sm" style="margin:10px 0">${esc(p.standard.name)} · ${esc(p.edition.label)} (edition ${tag('t-warn','unverified')})</p>
  <div class="card"><h3>Index completeness</h3><div class="tiles"><div class="tile"><b>${comp.stats.leaves}</b><span>hierarchy leaves</span></div><div class="tile"><b>${comp.stats.auditableWithObligation}</b><span>authored (deep)</span></div><div class="tile"><b>${comp.stats.unclassified.length}</b><span>unclassified</span></div><div class="tile"><b>${comp.obligations}</b><span>obligation records</span></div></div>
   <div class="warnbox"><b>This pack cannot be called complete.</b> ${comp.reasons.map(esc).join(' · ')}</div>
   <p class="muted xs" style="margin:0">Completeness is computed from catalogued hierarchy leaves and obligation identifiers — never from clause headings or the number of checklist questions. Hierarchy titles are Conform-Edge descriptors, not standard text; only titles of 8.5.1.1–8.5.1.3 have been independently checked.</p></div>
  <div class="card"><h3>Clause hierarchy</h3><div class="tree">${roots.map(r=>walk(r,0)).join('')}</div><p class="muted xs" style="margin:8px 0 0">Tap an authored (deep) leaf to open its checklist. Subordinate designators are catalogued only where known; none is invented.</p></div>
  <div class="card"><h3>Shared concept graph</h3><p class="muted xs" style="margin:0 0 6px">Shared intent across standards, without flattening standard-specific obligations.</p>${p.concepts.map(c=>`<div class="kv"><span class="k mono xs">${esc(c.id.replace('CONCEPT-',''))}</span><span class="v"><b>${esc(c.name)}</b><br>${p.obligations.filter(o=>(o.concepts||[]).includes(c.id)).map(o=>tag('t-sig',p.standard.id+' '+o.clauseRef)).join(' ')} ${c.crossStandard.map(x=>tag('t-neu',x.standard+': '+x.status)).join(' ')}</span></div>`).join('')}</div>`;
};

const SCAR_FORMS={ evidence:[['ref','Record / reference'],['description','What it shows'],['date','Date','date']], containment:[['action','Action'],['owner','Owner'],['due','Due','date']], correction:[['action','Action'],['owner','Owner'],['due','Due','date']],
  analysis:[['type','Cause type','sel:occurrence,escape,systemic'],['cause','Stated cause'],['status','Status','sel:hypothesis,verified'],['evidenceRefs','Evidence ids (comma-separated)']], action:[['causeRef','Linked cause','sel:occurrence,escape,systemic'],['action','Corrective action'],['owner','Owner'],['due','Due','date']], criterion:[['metric','Metric'],['threshold','Threshold'],['method','Method'],['verifyOn','Verify on','date']] };
function formRow(kind){ return `<div class="sec noprint"><div class="xs muted" style="margin-bottom:4px">Add ${kind}</div>${SCAR_FORMS[kind].map(([k,l,t])=>t&&t.startsWith('sel:')?`<select id="f-${kind}-${k}" aria-label="${l}">${t.slice(4).split(',').map(o=>`<option>${o}</option>`).join('')}</select>`:`<input type="${t||'text'}" id="f-${kind}-${k}" placeholder="${l}" aria-label="${l}" style="margin-bottom:4px">`).join('')}<button class="ghost s" style="margin-top:4px" onclick="scarAdd('${kind}')">Add</button></div>`; }
function scarAdd(kind){ const s=T.scar; const v={}; SCAR_FORMS[kind].forEach(([k])=>{ v[k]=$('f-'+kind+'-'+k).value.trim(); }); const n=(a,p)=>p+(a.length+1);
  if(kind==='evidence') s.evidence.push({id:n(s.evidence,'E'),ref:v.ref,description:v.description,date:v.date}); else if(kind==='containment') s.containment.push({id:n(s.containment,'C'),action:v.action,owner:v.owner,due:v.due,status:'planned',addresses:s.allegation.items.map(i=>i.id)}); else if(kind==='correction') s.correction.push({id:n(s.correction,'R'),action:v.action,owner:v.owner,due:v.due,status:'planned'});
  else if(kind==='analysis') s.rootCause.analyses.push({type:v.type,cause:v.cause,status:v.status,whys:[],evidenceRefs:v.evidenceRefs?v.evidenceRefs.split(',').map(x=>x.trim()):[],addresses:[]}); else if(kind==='action') s.correctiveActions.push({id:n(s.correctiveActions,'A'),causeRef:v.causeRef,action:v.action,owner:v.owner,due:v.due,status:'planned'}); else if(kind==='criterion') s.effectiveness.criteria.push({id:n(s.effectiveness.criteria,'EF'),metric:v.metric,threshold:v.threshold,method:v.method,verifyOn:v.verifyOn});
  render(); }

  return `<div class="row"><button class="ghost s" onclick="T.ncrId=null;render()">‹ Findings</button></div><div class="sp" style="margin-top:8px"><h2 style="margin:0">${n.id}</h2>${tag(n.status==='Issued'?'t-bad':'t-warn',n.status)}</div><p class="muted sm">${esc(s.audit.id)} · ${esc(ob.process)} · evidence from the imported record</p>
  <div class="warnbox"><b>DEMONSTRATION CONTENT.</b> The requirement and clause reference are not verified against the controlled source. In production mode this NCR could not be issued.</div>
  <div class="sec"><h3>Governing source</h3><div class="kv"><span class="k">Source</span><span class="v">${esc(Data.CLAUSE_INDEX.source)} ${esc(Data.CLAUSE_INDEX.edition)}</span></div><label class="fl">Exact clause reference (through paragraph / subdivision)</label><input type="text" id="cite" value="${esc(n.citation)}" ${locked?'disabled':''} oninput="onCite(this.value)" placeholder="e.g. 7.1.5.2(a)" autocapitalize="off"><div class="row wrap" style="margin-top:8px"><select id="pickc" style="width:auto;margin:0" ${locked?'disabled':''} onchange="onCite(this.value);$('cite').value=this.value"><option value="">Choose from catalogued hierarchy…</option>${fam.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div id="citeres"></div></div>
  <div class="sec sb"><h3>Should Be — required condition</h3><textarea id="sb" ${locked?'disabled':''} oninput="curNCR().shouldBe=this.value;gatesRefresh()">${esc(n.shouldBe)}</textarea><label class="row" style="margin-top:8px;font-size:13px"><input type="checkbox" id="att" ${n.shouldBeAttested?'checked':''} ${locked?'disabled':''} onchange="curNCR().shouldBeAttested=this.checked;gatesRefresh()"> I have checked this Should Be against my licensed copy of ${esc(Data.CLAUSE_INDEX.source)} ${esc(Data.CLAUSE_INDEX.edition)}.</label><p class="muted xs" style="margin:6px 0 0">Accurate paraphrase of the verified obligation; licensed text is not reproduced.</p></div>
  <div class="sec af"><h3>As Found — objectively verified condition</h3><textarea id="af" ${locked?'disabled':''} placeholder="Observed condition with dates and record/sample identifiers" oninput="curNCR().asFound=this.value;gatesRefresh()">${esc(n.asFound)}</textarea>${locked?'':`<div class="row" style="margin-top:8px"><button class="ghost s" onclick="draftAF()">Draft from linked evidence</button></div>`}<label class="fl">Statement of nonconformity — the difference between requirement and verified condition</label><textarea id="df" ${locked?'disabled':''} oninput="curNCR().statement=this.value;gatesRefresh()">${esc(n.statement)}</textarea><label class="fl">Objective evidence linked</label><div>${n.evidenceIds.map(i=>`<span class="tag t-sig" style="margin:0 6px 6px 0">${esc(i)}</span>`).join('')||'<span class="muted sm">none</span>'}</div></div>
  <div class="sec"><h3>Classification</h3><label class="fl">Scheme</label><select ${locked?'disabled':''} onchange="curNCR().scheme=this.value;curNCR().class='';render()">${TD.NCR_SCHEMES.map(x=>`<option value="${x.id}" ${x.id===n.scheme?'selected':''}>${esc(x.label)}</option>`).join('')}</select><div style="margin-top:8px">${sch.classes.map(c=>`<span class="chipb ${n.class===c?'on':''}" onclick="${locked?'':`curNCR().class='${c}';render()`}">${c}</span>`).join('')}</div><textarea id="cls" ${locked?'disabled':''} placeholder="Rationale for the classification" oninput="curNCR().classRationale=this.value;gatesRefresh()">${esc(n.classRationale)}</textarea><p class="muted xs">${esc(sch.aid)}</p></div>
  <div class="card"><h3>Issuance checks</h3><div id="gates"></div></div><div id="ncract"></div>
  ${n.status==='Issued'?'':`<details class="aid noprint"><summary>Discard this draft</summary><textarea id="dreason" placeholder="Reason"></textarea><button class="ghost" style="margin-top:8px" onclick="discardNcr()">Discard draft</button><div id="dmsg"></div></details>`}
  ${locked?'':`<details class="aid noprint"><summary>Review aid — try incorrect citations</summary>${['7.1.5.2','7.1.5','7.1.5.2(b)','7.1.5.2(e)','7.9.9'].map(c=>`<button class="ghost s" style="margin:3px" onclick="$('cite').value='${c}';onCite('${c}')">${c}</button>`).join('')}</details>`}`;
}
function onCite(v){ curNCR().citation=v; citeRefresh(); gatesRefresh(); }
function citeRefresh(){ const n=curNCR(); if(!n||!$('citeres')) return; if(!n.citation){ $('citeres').innerHTML='<p class="muted xs">Enter or choose the exact governing reference.</p>'; return; } const r=importedSession().citationCheck(n); $('citeres').innerHTML=`<div class="${r.ok?'okbox':'block'}" style="margin-top:8px"><b>${r.ok?'Verified':r.level==='incomplete'?'Incomplete reference':r.level==='mismatch'?'Reference does not govern this condition':'Invalid reference'}.</b> ${r.messages.map(esc).join(' ')}</div>`; }
function gatesRefresh(){ const n=curNCR(); if(!n||!$('gates')) return; const s=importedSession(); const g=s.gates(n); T.imported=s.audit;
  $('gates').innerHTML=g.map(x=>`<div class="gate ${x.ok?'p':'f'}"><b>${x.n}</b><span>${x.ok?'✓':'✗'} ${esc(x.msg)}</span></div>`).join('');
  let a=''; if(n.status==='Draft') a=`<button class="btn" ${Core.readyForReview(g)?'':'disabled'} onclick="ncrStep('submit')">${Core.readyForReview(g)?'Submit for auditor review':'Resolve checks to submit'}</button><p class="muted xs" style="text-align:center">A deficient NCR cannot be finalized.</p>`;
  else if(n.status==='In auditor review') a=`<div class="card"><h3>Auditor review and approval</h3><div class="kv"><span class="k">Approver</span><span class="v">${esc(s.audit.auditor.name)} · ${esc(s.audit.auditor.role)}</span></div><button class="btn" style="margin-top:10px" onclick="ncrStep('approve')">Approve and issue NCR</button><button class="ghost" style="margin-top:8px;width:100%" onclick="ncrStep('return')">Return to draft</button></div>`; else a=`<div class="okbox">Issued — approved by ${esc(n.approval.by)} (${esc(n.approval.authId)}).</div>`; $('ncract').innerHTML=a; }
function ncrStep(k){ const s=importedSession(), n=curNCR(); if(k==='submit') s.submitNCR(n); else if(k==='approve') s.approveNCR(n); else n.status='Draft'; T.imported=s.audit; render(); }
function draftAF(){ const n=curNCR(), s=importedSession(); const ev=n.evidenceIds.map(id=>s.audit.evidence[id]).filter(e=>e&&e.type!=='interview'&&e.links.some(l=>l.ob===n.obId&&l.effect==='contradicts'&&e.verified)); const a=s.assessment(n.obId), un=a.attrs.filter(x=>x.status==='unmet');
  n.asFound=ev.slice(0,3).map(e=>`${e.date}: ${e.ref} (${e.id}) — ${e.text}`).join(' ')+(un.length?` Aspect not met: ${un.map(x=>x.attr.text).join('; ')}.`:''); if(!n.statement) n.statement=`The requirement is that ${un.length?un[0].attr.text.toLowerCase():'the obligation is met'}; the linked records show the opposite condition for the cited items, so the requirement was not met for them.`; T.imported=s.audit; render(); }
function discardNcr(){ const s=importedSession(); const r=s.discardNCR(curNCR(),$('dreason').value); if(!r.ok){ $('dmsg').innerHTML='<div class="block">'+esc(r.reason)+'</div>'; return; } T.imported=s.audit; T.ncrId=null; render(); }

/* ======================= Competency ======================= */
function compStart(){ T.comp.answers={}; T.comp.result=null; T.comp.started=true; render(); }
function compSet(){ return CP.buildSet(pack(),T.comp.seed); }
V.competency=()=>{
  const set=compSet();
  const head=`<h2>Competency Assessment</h2><div class="warnbox"><b>PRACTICE MODE.</b> Items are derived from the validated checklist library, but they and their scoring criteria have <b>not been expert-reviewed</b>. Results are not a determination of auditor competence. Generic AI agreement is never treated as proof of competence.</div>`;
  if(!T.comp.started) return head+`<div class="card"><p class="sm">Nine items test: interpreting the intended requirement, identifying the correct subordinate clause, applicability, evidence selection, verification questions, risk-based sampling, insufficient evidence versus nonconformity, equivalent valid controls, and drafting a defensible Should Be / As Found NCR.</p><button class="btn" onclick="compStart()">Start practice assessment</button></div>`;
  if(T.comp.result){ const r=T.comp.result; return head+`<div class="card"><h3>Result</h3><div class="sm"><b>${r.pct}%</b> (${r.total.toFixed(1)} of ${r.max}) — ${tag('t-warn',r.mode)}</div><p class="sm">${esc(r.statement)}</p>${CP.DIMENSIONS.map(([k,l])=>{ const d=r.perDimension[k]; return `<div class="kv"><span class="k">${k}</span><span class="v">${esc(l)}<div class="progress" style="margin:4px 0"><span style="width:${Math.round(100*d.points/d.max)}%"></span></div><span class="xs muted">${r.detail.find(x=>x.dimension===k).note}</span></span></div>`; }).join('')}<div class="row" style="margin-top:10px"><button class="ghost" onclick="compStart()">Retake</button><button class="ghost" onclick="T.comp.seed++;compStart()">New item set</button></div></div>`; }
  return head+set.items.map((it,i)=>`<div class="card"><div class="sp"><span class="pill">${i+1}. ${esc(it.dimension)}</span>${tag('t-neu','expert review: '+it.expertReview.status)}</div><p class="sm" style="margin:8px 0 4px">${esc(it.prompt)}</p>${it.free?`<input type="text" id="c-${it.id}-citation" placeholder="Exact reference" oninput="compFree('${it.id}')" value="${esc((T.comp.answers[it.id]||{}).citation||'')}"><textarea id="c-${it.id}-shouldBe" placeholder="Should Be" oninput="compFree('${it.id}')">${esc((T.comp.answers[it.id]||{}).shouldBe||'')}</textarea><textarea id="c-${it.id}-asFound" placeholder="As Found (dates, record identifiers)" oninput="compFree('${it.id}')">${esc((T.comp.answers[it.id]||{}).asFound||'')}</textarea><textarea id="c-${it.id}-statement" placeholder="Statement of nonconformity" oninput="compFree('${it.id}')">${esc((T.comp.answers[it.id]||{}).statement||'')}</textarea><div class="muted xs">Scenario evidence: TW-0417 calibration due 2026-08-31 (EV-CAL-TW-0417); used 2026-09-17 on WO-88213 op 40 (EV-WO-88213-OP40); no extension on file (EV-DEV-LOG). Requirement area: ${esc(ix()[it.obligationId].title)}.</div>`:it.options.map(o=>`<label class="opt"><input type="${it.multi?'checkbox':'radio'}" name="${esc(it.id)}" ${(it.multi?(T.comp.answers[it.id]||[]).includes(o):T.comp.answers[it.id]===o)?'checked':''} onchange="compPick('${it.id}',${it.multi},this)" data-v="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>`).join('')+`<button class="btn" onclick="compSubmit()">Submit for scoring</button>`;
};
function compPick(id,multi,el){ const v=el.getAttribute('data-v'); if(multi){ const a=T.comp.answers[id]||[]; const i=a.indexOf(v); if(el.checked&&i<0)a.push(v); if(!el.checked&&i>=0)a.splice(i,1); T.comp.answers[id]=a; } else T.comp.answers[id]=v; save(); }
function compFree(id){ T.comp.answers[id]={citation:$('c-'+id+'-citation').value,shouldBe:$('c-'+id+'-shouldBe').value,asFound:$('c-'+id+'-asFound').value,statement:$('c-'+id+'-statement').value}; save(); }
function compSubmit(){ T.comp.result=CP.score(compSet(),T.comp.answers,TD.ncrScenarioEval); render(); }

render();
</script>
